<!doctype html>
<!-- 分享預覽圖（og:image）的原稿。重新產生：用瀏覽器 headless 以 1200x630 截圖存成 assets/og-image.png -->
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: #3b2f22;
    background: radial-gradient(circle at 18% 30%, #fff0c2 0, transparent 45%), #fff8ec; position: relative; }
  .wrap { position: absolute; inset: 0; display: grid; grid-template-columns: 420px 1fr; align-items: center; padding: 40px 64px 120px; gap: 40px; }
  .icon svg { width: 380px; height: 380px; display: block; border-radius: 64px; box-shadow: 0 12px 40px rgba(120, 80, 20, .18); }
  h1 { font-size: 104px; font-weight: 900; line-height: 1.05; letter-spacing: .02em; }
  .sub { font-size: 46px; font-weight: 700; margin-top: 14px; }
  .sub2 { font-size: 34px; font-weight: 500; color: #7a6852; margin-top: 6px; }
  .slogan { display: inline-block; margin-top: 26px; background: #b5540d; color: #fff; font-size: 44px; font-weight: 900; padding: 8px 30px; border-radius: 999px; letter-spacing: .04em; }
  .slogan b { color: #ffd45e; font-size: 54px; }
  .heart { position: absolute; left: 0; right: 0; bottom: 0; height: 104px; background: #2f74b5; display: flex; align-items: center; justify-content: center; gap: 22px; }
  .heart::before { content: ""; position: absolute; left: 0; right: 0; top: -22px; height: 24px;
    background: radial-gradient(circle at 30px -6px, transparent 26px, #2f74b5 27px) repeat-x; background-size: 60px 24px; }
  .chip { display: flex; align-items: center; gap: 10px; background: #fff8ec; border-radius: 999px; padding: 6px 22px 6px 8px; font-size: 30px; font-weight: 700; }
  .chip i { font-style: normal; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 30px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">
      <svg viewBox="0 0 64 64">
        <rect width="64" height="64" fill="#FFF1D6"/>
        <g stroke="#F5A524" stroke-width="4" stroke-linecap="round"><line x1="32" y1="6" x2="32" y2="11"/><line x1="13" y1="14" x2="16.5" y2="17.5"/><line x1="51" y1="14" x2="47.5" y2="17.5"/><line x1="6" y1="32" x2="11" y2="32"/><line x1="58" y1="32" x2="53" y2="32"/></g>
        <circle cx="32" cy="34" r="15" fill="#FFC83D"/>
        <path d="M32 37.5 C32 37.5 25.5 33.6 25.5 29.4 C25.5 27.2 27.2 25.8 29 25.8 C30.4 25.8 31.5 26.6 32 27.8 C32.5 26.6 33.6 25.8 35 25.8 C36.8 25.8 38.5 27.2 38.5 29.4 C38.5 33.6 32 37.5 32 37.5Z" fill="#E2677E"/>
        <path d="M0 40 q8 -6 16 0 t16 0 t16 0 t16 0 V64 H0Z" fill="#2F74B5"/>
        <path d="M0 50 q8 -6 16 0 t16 0 t16 0 t16 0" stroke="#9FD0F5" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <div>
      <h1>台北的陽光</h1>
      <p class="sub">認識市長候選人沈伯洋</p>
      <p class="sub2">親子快速指南</p>
      <p class="slogan">台北靠<b>3</b>沈伯洋</p>
    </div>
  </div>
  <div class="heart">
    <span class="chip"><i style="background:#2f8a57">H</i>空間</span>
    <span class="chip"><i style="background:#2f74b5;outline:3px solid #fff8ec">E</i>機會</span>
    <span class="chip"><i style="background:#c84664">A</i>陪伴</span>
    <span class="chip"><i style="background:#7a52b8">R</i>韌性</span>
    <span class="chip"><i style="background:#c46a0c">T</i>時間</span>
  </div>
</body>
</html>
